<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entering Store — Grab&amp;Go</title>
    <link rel="stylesheet" href="shared/styles.css" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
      }

      .entering-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
        text-align: left;
        padding: 32px;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        padding-right: 20px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .entering-title {
        font-size: 18px;
        font-weight: 600;
        color: #111827;
        margin: 0;
      }

      .entering-subtitle {
        font-size: 14px;
        color: #6b7280;
        margin: 0;
      }

      .entering-error {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .entering-error__text {
        font-size: 14px;
        color: #ef4444;
        margin: 0;
      }

      .btn-retry {
        background: #22c55e;
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="entering-card">
      <div id="loading-state">
        <div class="spinner"></div>
        <p class="entering-title" id="status-title">Entering store</p>
        <p class="entering-subtitle" id="status-subtitle">
          Verifying your entry...
        </p>
      </div>

      <div class="entering-error" id="error-state">
        <p class="entering-error__text" id="error-text"></p>
        <button class="btn-retry" id="btn-retry">Try Again</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script src="shared/config.js" defer></script>
    <script src="shared/api.js" defer></script>
    <script src="shared/guard.js" defer></script>
    <script src="entering-store.js" defer></script>
  </body>
</html>
