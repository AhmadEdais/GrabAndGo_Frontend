<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grab&Go — Gate</title>
    <link rel="stylesheet" href="shared/styles.css" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111827;
      }

      .gate-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .qr-frame {
        width: 400px;
        height: 400px;
        background: #ffffff;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(34, 197, 94, 0.25);
      }

      .qr-frame img {
        width: 360px;
        height: 360px;
      }

      .gate-text {
        text-align: center;
        color: #f8f9fa;
      }

      .gate-text h1 {
        margin: 0 0 4px 0;
        font-size: 20px;
        font-weight: 600;
      }

      .gate-text p {
        margin: 0;
        font-size: 14px;
        color: #9ca3af;
      }

      .gate-status {
        font-size: 12px;
        color: #22c55e;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="gate-card">
      <div class="qr-frame">
        <img id="qr-image" src="" alt="Gate QR Code" hidden />
      </div>
      <div class="gate-text">
        <h1>Gate QR Code Simulation</h1>
        <p>Scan to enter the store</p>
        <div id="gate-status" class="gate-status"></div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script src="shared/config.js" defer></script>
    <script src="gate.js" defer></script>
  </body>
</html>
